#@TYPE: Machine
#@NAME: Aerium Lumen — Jetson Orin NX 16GB (P3767-0000)
#@DESCRIPTION: Aerium Lumen carrier board with Jetson Orin NX 16GB module

# Pull in the NVIDIA reference config for this SOM (p3768 devkit carrier
# as reference — Lumen uses the same SOM with a custom carrier).
require conf/machine/p3768-0000-p3767-0000.conf

# Add "lumen" override for all Lumen-specific recipes/bbappends
MACHINEOVERRIDES =. "lumen:"

# Lumen UART: serial@3110000 is enabled via BSP patch → exposed as /dev/ttyTHS0
# Override kernel args to add ttyTHS0 as secondary console
KERNEL_ARGS:append = " console=ttyTHS0,115200"
