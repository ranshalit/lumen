# Phase 2 — Strip Bluetooth and audio codec modules
#
# Safe to revert: git revert <commit> && bitbake linux-jammy-nvidia-tegra
#
# All options below are =m; SOUND=y / SND=y core infrastructure stays built-in.
# No Bluetooth hardware and no audio output/input used on Lumen.

# ── Bluetooth transport drivers ───────────────────────────────────────────────
# No BT hardware; these modules are loaded by udev even when unused.
# CONFIG_BT_BNEP is not set
# CONFIG_BT_HIDP is not set
# CONFIG_BT_INTEL is not set
# CONFIG_BT_BCM is not set
# CONFIG_BT_RTL is not set
# CONFIG_BT_QCA is not set
# CONFIG_BT_HCIBTUSB is not set
# CONFIG_BT_HCIUART is not set

