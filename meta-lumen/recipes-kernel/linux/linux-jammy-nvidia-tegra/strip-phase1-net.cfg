# Phase 1 — Strip unused networking modules
#
# Safe to revert: git revert <commit> && bitbake linux-jammy-nvidia-tegra
#
# Applies to all lumen-orin-* machines (lumen MACHINEOVERRIDES).
# All options below are =m in the upstream config, so no built-in breakage.

# ── IPv6 ──────────────────────────────────────────────────────────────────────
# Not used; removing saves ~20 modules from udev module loading at boot.
# CONFIG_IPV6 is not set

# ── WiFi stack ────────────────────────────────────────────────────────────────
# No WiFi hardware on Lumen. cfg80211 + mac80211 are loaded by udev on boot
# even with no card present when the modules exist on disk.
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_ATH_COMMON is not set
# CONFIG_ATH10K is not set
# CONFIG_ATH10K_PCI is not set
# CONFIG_ATH10K_SNOC is not set

# ── CAN bus ───────────────────────────────────────────────────────────────────
# No CAN hardware on Lumen.
# CONFIG_CAN is not set
# CONFIG_CAN_RAW is not set
# CONFIG_CAN_BCM is not set
# CONFIG_CAN_GW is not set
# CONFIG_CAN_VCAN is not set
# CONFIG_CAN_DEV is not set

# ── Unused tunnel/overlay protocols ──────────────────────────────────────────
# Containers use --network=host; no VXLAN/SIT overlay needed.
# CONFIG_VXLAN is not set
# CONFIG_IPV6_SIT is not set

# ── Bridge netfilter & conntrack ──────────────────────────────────────────────
# No iptables/netfilter rules used; no bridge networking for containers.
# CONFIG_BRIDGE_NETFILTER is not set
# CONFIG_BRIDGE_NF_EBTABLES is not set
# CONFIG_NF_CONNTRACK is not set
# CONFIG_NETFILTER_NETLINK is not set
# CONFIG_NF_LOG_SYSLOG is not set

# ── Unused filesystems ────────────────────────────────────────────────────────
# Only ext4 + vfat + tmpfs used.
# CONFIG_BTRFS_FS is not set

# ── Broadcom Ethernet & PHY drivers ──────────────────────────────────────────
# Lumen uses Realtek r8169 GbE; BCM/Broadcom Ethernet drivers not needed.
# CONFIG_BCMGENET is not set
# CONFIG_BCM54140_PHY is not set
# CONFIG_BCM7XXX_PHY is not set
# CONFIG_BCM_NET_PHYLIB is not set
