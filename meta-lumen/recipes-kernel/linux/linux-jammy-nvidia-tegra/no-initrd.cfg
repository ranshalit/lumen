# Build NVMe + Tegra PCIe stack directly into the kernel so the board
# can mount the NVMe rootfs without an initramfs.
#
# With INITRAMFS_IMAGE="" the tegra-minimal-initramfs is not built and
# platform-preboot.sh is not used. The kernel must be able to access
# the NVMe drive on its own from early boot.
#
# Rootfs is hardcoded as root=/dev/nvme0n1p1 (partition layout confirmed:
# APP is always at id=1; A/B redundancy is kernel-only, not rootfs).
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_NVME=y
CONFIG_PCIE_TEGRA194=y
CONFIG_PCIE_TEGRA194_HOST=y
CONFIG_PCIE_TEGRA194_EP=n
CONFIG_PHY_TEGRA194_P2U=y
