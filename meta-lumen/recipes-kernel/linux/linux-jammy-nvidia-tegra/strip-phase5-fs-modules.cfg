# Phase 5 — Convert VFAT and NTFS to kernel modules
#
# NVIDIA's KernelBootTimeOptimization guide recommends building filesystems
# not required at early boot as modules so they are loaded on-demand rather
# than initialised unconditionally during kernel init:
#   CONFIG_FUSE_FS=m  (already a module upstream — no change needed)
#   CONFIG_VFAT_FS=m
#   CONFIG_NTFS_FS=m
#
# Lumen rootfs is ext4 on NVMe.  The EFI system partition is consumed by
# UEFI firmware (which has its own FAT driver) before the kernel starts;
# the kernel itself never mounts the ESP during normal operation.
# NTFS is never used on the embedded platform.
# Moving FAT/VFAT and NTFS to modules removes their init work from the
# critical boot path; they load automatically via udev if ever needed.
#
# Safe to revert: git revert <commit> && bitbake linux-jammy-nvidia-tegra

CONFIG_FAT_FS=m
CONFIG_VFAT_FS=m
CONFIG_NTFS_FS=m
