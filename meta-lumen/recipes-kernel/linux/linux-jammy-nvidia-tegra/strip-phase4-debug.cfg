# Phase 4 — Disable kernel debug and tracing infrastructure
#
# NVIDIA's boot-time optimisation guide explicitly lists FTRACE, TRACER, and
# KMEMLEAK as options to disable in production configurations.
# These are all enabled in NVIDIA's upstream Tegra defconfig; none are needed
# on a headless production board.
#
# Safe to revert: git revert <commit> && bitbake linux-jammy-nvidia-tegra

# ── Function tracer (FTRACE) ──────────────────────────────────────────────────
# Disabling FTRACE removes all tracing ring-buffer and hook setup at boot.
# FUNCTION_TRACER, DYNAMIC_FTRACE, and every ftrace sub-feature are implicitly
# disabled when CONFIG_FTRACE is unset.
# CONFIG_FTRACE is not set

# ── SLUB allocator debug ──────────────────────────────────────────────────────
# SLUB_DEBUG adds per-allocation metadata and poisoning; its init scan at boot
# is measurable overhead on a memory-heavy kernel like Tegra.
# CONFIG_SLUB_DEBUG is not set

# ── Debug kernel menu ──────────────────────────────────────────────────────────
# Unsetting DEBUG_KERNEL collapses the debug sub-menu; individual options
# already unset above are listed here for clarity but the parent being
# unset is the effective gate.
# CONFIG_DEBUG_KERNEL is not set
