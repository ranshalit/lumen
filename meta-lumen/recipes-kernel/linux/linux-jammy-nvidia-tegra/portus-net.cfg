# Portus M.2 Key A/E expansion card — networking
#
# The Portus card carries a Microchip LAN7430 PCIe Gigabit Ethernet
# controller (plus a USB2514B hub and FT234 UART bridges). The LAN7430
# needs the lan743x driver, which is disabled in the upstream tegra
# defconfig (# CONFIG_LAN743X is not set) — so its Ethernet port never
# enumerates. Enable it as a module.
#
# Docs: https://docs.aerium.co.il/Product%20Manuals/Portus
CONFIG_LAN743X=m
