# Docker kernel requirements
#
# Enables cgroups, namespaces, overlayfs, and iptables NAT needed by dockerd.
# All app containers use --network=host, but dockerd unconditionally initialises
# its bridge network controller and creates iptables NAT chains at startup —
# without CONFIG_NF_NAT / CONFIG_IP_NF_NAT dockerd fails to start entirely.
# Applied on all lumen-orin-* machines.

# ── cgroup v1 + v2 ────────────────────────────────────────────────────────────
CONFIG_CGROUPS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_HUGETLB=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_BPF=y

# ── Linux namespaces ──────────────────────────────────────────────────────────
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

# ── OverlayFS (docker storage driver) ────────────────────────────────────────
CONFIG_OVERLAY_FS=y

# ── Seccomp (docker default seccomp profile) ─────────────────────────────────
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# ── Netfilter / iptables NAT ─────────────────────────────────────────────────
# dockerd creates iptables NAT chains (DOCKER, DOCKER-ISOLATION-*) at startup
# regardless of container network mode. Kept as modules; loaded automatically.
CONFIG_NETFILTER=y
CONFIG_NETFILTER_NETLINK=m
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_NAT=m
CONFIG_NF_LOG_SYSLOG=m
