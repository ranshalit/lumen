# Docker kernel requirements
#
# Enables cgroups, namespaces, and overlayfs needed by dockerd.
# All app containers use --network=host; dockerd is configured with
# iptables=false + bridge=none in daemon.json so NAT/conntrack modules
# are not needed and remain stripped in strip-phase1-net.cfg.
# Applied on all lumen-orin-* machines.

# ── cgroup v1 + v2 ────────────────────────────────────────────────────────────
CONFIG_CGROUPS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_HUGETLB=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_BPF=y

# ── Linux namespaces ──────────────────────────────────────────────────────────
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

# ── OverlayFS (docker storage driver) ────────────────────────────────────────
CONFIG_OVERLAY_FS=y

# ── Seccomp (docker default seccomp profile) ─────────────────────────────────
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
