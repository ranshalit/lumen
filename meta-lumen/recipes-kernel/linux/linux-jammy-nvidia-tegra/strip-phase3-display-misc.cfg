# Phase 3 — Strip display drivers and miscellaneous unused modules
#
# Safe to revert: git revert <commit> && bitbake linux-jammy-nvidia-tegra
#
# NOTE: CONFIG_DRM and CONFIG_TEGRA_HOST1X are intentionally kept.
#   DRM core is kept because nvidia-kernel-oot (GPU compute / V4L2) may
#   depend on DRM infrastructure at runtime.
#   TEGRA_HOST1X is kept as it is the bus for CUDA/NvMedia peripherals.

# ── Nvidia discrete GPU (Nouveau) ─────────────────────────────────────────────
# Tegra234 (Orin) has an integrated Ampere GPU; Nouveau is for discrete
# Nvidia dGPUs and will never be needed on this platform.
# CONFIG_DRM_NOUVEAU is not set

# ── Tegra display controller ─────────────────────────────────────────────────
# NOTE: DRM_TEGRA is intentionally kept despite Lumen being headless.
# DRM_TEGRA has "select TEGRA_HOST1X" — stripping it cascades to unset
# TEGRA_HOST1X (not in defconfig directly), which breaks all nvidia-kernel-oot
# OOT modules that depend on host1x_* symbols at modpost time.

# ── DRM display encoder / bridge chips ───────────────────────────────────────
# CONFIG_DRM_I2C_CH7006 is not set
# CONFIG_DRM_I2C_SIL164 is not set
# CONFIG_DRM_I2C_NXP_TDA998X is not set
# CONFIG_DRM_DP_AUX_BUS is not set

# ── SPI host controllers for other SoCs ──────────────────────────────────────
# Lumen uses Tegra SPI (stays). RPi SPI controllers are not present.
# CONFIG_SPI_BCM2835 is not set
# CONFIG_SPI_BCM2835AUX is not set
