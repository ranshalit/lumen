# Defer nvgpu auto-load until after the login prompt.
#
# /etc/init.d/udev (S04 in rcS.d) runs `udevadm trigger --action=add` followed
# by `udevadm settle`, which walks every device in /sys and fires modprobe for
# anything that matches an internal modalias. nvgpu advertises
#
#   of:N*T*Cnvidia,ga10b*   nvgpu     (Orin GPU node)
#
# so udev pulls nvgpu in *during S04* and `settle` blocks ~3 s on its probe.
# That is the real path-to-prompt cost; the old S06modutils.sh `modprobe nvgpu`
# was a no-op since udev had already loaded it.
#
# `blacklist` makes modprobe ignore nvgpu's *internal* aliases (those of:* /
# pci:* / etc. lines that the kernel autogenerates from MODULE_DEVICE_TABLE).
# It does NOT block an explicit `modprobe nvgpu` by name, so the deferred
# `mod:5:once:/etc/init.d/modutils.sh` entry in /etc/inittab still loads it
# after the prompt is up — pulling nvmap + host1x + mc-utils + nvsciipc in via
# modules.dep automatically.
#
# pwm-fan and ina3221 are intentionally NOT blacklisted: their probes are
# microseconds and their drivers (fan curve, power monitor) are expected to be
# live by the time userspace launches.
blacklist nvgpu
