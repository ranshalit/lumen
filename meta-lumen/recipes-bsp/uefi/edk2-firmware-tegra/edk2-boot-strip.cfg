# Disable storage controllers not present on Lumen (NVMe-only boot)
# CONFIG_EMMC is not set
# CONFIG_SDCARD is not set
# CONFIG_UFS is not set
# CONFIG_SATA is not set

# Disable USB host (headless embedded system; flash/serial use separate HW)
# CONFIG_SOC_USB is not set
# CONFIG_XHCI is not set
# CONFIG_EHCI is not set
# CONFIG_SELECT_ALL_USB_DEVICES is not set

# Disable display (headless system; video=efifb:off already in kernel args)
# CONFIG_NVIDIA_DISPLAY is not set

# Disable logo (no display)
# CONFIG_LOGO is not set

# Disable all network boot modes and devices
# CONFIG_SELECT_ALL_NETWORKING_MODES is not set
# CONFIG_NETWORKING_DEVICE_REALTEK is not set
# CONFIG_NETWORKING_DEVICE_ASIX is not set
# CONFIG_NETWORKING_DEVICE_NVIDIA is not set

# Disable firmware capsule updates (not needed for production)
# CONFIG_FIRMWARE_CAPSULE_SUPPORTED is not set

# Disable UEFI shell (not needed for automated boot)
# CONFIG_SELECT_ALL_SHELL_COMMANDS is not set

# Disable ACPI thermal zone (not needed for minimal boot)
# CONFIG_ACPI_THERMAL_ZONE_SINGLE is not set

# Disable UEFI menu password (not needed)
# CONFIG_SECURITY_UEFI_MENU_USER_AUTH is not set

# Disable bootloader ramdisk (we use L4TLauncher -> extlinux -> kernel flow)
# CONFIG_BOOTLOADER_RAMDISK is not set

# Disable TPM (no Secure Boot, no OS TPM2 usage)
CONFIG_SECURITY_TPM_NONE=y
# CONFIG_SECURITY_TPM_FIRMWARE is not set
# CONFIG_SECURITY_TPM_DISCRETE is not set

# Disable UEFI Secure Boot (images not signed on Lumen)
# CONFIG_SECURITY_UEFI_SECURE_BOOT is not set

# No serial console in UEFI phase (headless; Linux ttyTHS0 used post-handoff)
CONFIG_SERIAL_PORT_CONSOLE_NONE=y

# NOTE: BOOT_UI_MENU_DISABLED intentionally kept enabled — PlatformBm.c:1151
# unconditionally calls EfiBootManagerGetBootManagerMenu() and ASSERTs on
# failure, so removing the menu app causes a guaranteed crash in BdsDxe.

# Disable Android partition support and Fastboot (Linux board, not Android)
# CONFIG_BOOT_NATIVE_ANDROID_PARTITION_SUPPORT is not set
# CONFIG_BOOT_ANDROID_FASTBOOT is not set

# Disable EFI Byte Code VM (no EBC drivers on Jetson)
# CONFIG_EBC is not set

# Disable memory test (production board; zero benefit)
# CONFIG_MEMORY_TEST is not set

# Disable server RAS and PRM (not a datacenter node)
# CONFIG_RAS is not set
# CONFIG_PRM_PACKAGE_SUPPORT is not set

# NOTE: CONFIG_FIRMWARE_MANAGEMENT intentionally kept — disabling it causes
# a BdsDxe ASSERT crash (boot partition driver dependency mismatch).
