# kas/lumen-common.yml
# Common layers and settings for all Lumen board variants.
# Include this file from per-machine kas configs.
#
# Usage:
#   kas build kas/lumen-orin-nx-16gb.yml
#   kas build kas/lumen-orin-nano-8gb.yml
#
# Layer commits are pinned for reproducible builds.
# To update layers: change the commit SHAs and re-test.

header:
  version: 14

distro: poky

target: lumen-image-minimal

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    commit: d4576e3c081a7ee7b57d48421c4c4f491cb4defe
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    commit: d8cc4e44001c7257273d290ce8c4496e93d32841
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: scarthgap
    commit: 9d0007a369deb4a6346f5ab7a9e6d432a8ed14fe
    layers:
      .:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra
    branch: scarthgap
    commit: d2613418be82dd95733824a0839c185ec0e02f2d
    layers:
      .:

  meta-lumen:
    path: meta-lumen
    layers:
      .:

local_conf_header:
  standard: |
    # Shared download and sstate-cache directories
    DL_DIR = "/media/ranshal/jetson/shared/downloads"
    SSTATE_DIR = "/media/ranshal/jetson/shared/sstate"

    # Image types: ext4 for rootfs + tegraflash tarball for flashing
    IMAGE_FSTYPES = "ext4 tegraflash"

    # Accept NVIDIA binary licenses
    LICENSE_FLAGS_ACCEPTED = "commercial nvidia-tegra"

    # Required by nvidia-container-toolkit and nvidia-docker
    DISTRO_FEATURES:append = " virtualization"

    # Use BusyBox init (sysvinit-compatible, no systemd)
    VIRTUAL-RUNTIME_init_manager = "sysvinit"
    VIRTUAL-RUNTIME_initscripts = "initscripts"

    # Disable SPDX generation (avoid packagegroup SPDX race condition)
    INHERIT:remove = "create-spdx"
