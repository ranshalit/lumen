version: '3.9'

services:
  lumen-dummy:
    image: lumen-base:latest
    container_name: lumen-dummy
    network_mode: host
    runtime: nvidia
    privileged: true
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - /opt/dragonfly/validate.sh:/validate.sh:ro
    command: ["/bin/sh", "/validate.sh"]
